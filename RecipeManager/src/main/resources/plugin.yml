name: RecipeManager
version: '${project.version}'
main: me.branko.recipemanager.RecipeManagerPlugin
api-version: '1.21'
authors: [Branko]
description: Disable or change any crafting/smithing/cooking recipe from a config file.
softdepend: [ViaVersion, ViaBackwards, ViaRewind]
commands:
  recipes:
    description: Manage recipes
    usage: /<command> <reload|list>
    aliases: [recipemanager]
    permission: recipemanager.admin
permissions:
  recipemanager.admin:
    description: Use /recipes
    default: op
